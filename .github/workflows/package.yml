name: package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      # Full history so the version derived by packaging/build-deb.sh (a
      # 0.0.0+g<sha> on an untagged commit, the tag on a tagged one) is right.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Builds dist/albert-plugins_<version>_all.deb.
      - run: just deb

      - uses: actions/upload-artifact@v7
        with:
          name: albert-plugins-deb
          path: dist/*.deb
          if-no-files-found: error
