# isort ------------------------------------------------------------------------
[tool.isort]
include_trailing_comma = true
line_length = 95
multi_line_output = 3
profile = "black"

# black ------------------------------------------------------------------------
[tool.black]
preview = true
line-length = 95
target-version = ['py38', 'py39']
include = '\.pyi?$'

# mypy -------------------------------------------------------------------------
[tool.mypy]
# The code is written for python 3.8 (the launcher ships 3.8 for most users), and
# ruff's target-version agrees, so nothing newer may sneak in. mypy 1.x refused
# anything below 3.10 outright and this repo runs mypy 2.x, which dropped those
# versions; the 3.8 floor is therefore enforced by ruff's UP/pyupgrade rules
# rather than here. Remove this line only once the minimum really moves up.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# The four logging helpers are attached to the plugin's own module by the
# launcher's loader (py::setattr in pypluginloader.cpp), so inside a plugin they
# are bare globals that no import can satisfy. Without this, every `debug(...)`
# in all 27 plugins is a `name-defined` error that the code is not able to fix.
disable_error_code = ["name-defined"]
# Every dependency lives in the launcher's per-plugin virtualenv, not in CI's
# venv, so the installed packages here are only what happens to be on the box.
# mypy reading their PEP 561 stubs drags their own requirements into the run -
# numpy's .pyi needs python 3.12 syntax and aborts the whole check - and none of
# it says anything about the plugin code. Imports of third-party modules are
# resolved as Any instead, via ignore_missing_imports above.
no_site_packages = true
# the plugins and the harness, and nothing else: the projects in norecursedirs
# are unrelated checkouts with their own dependency sets
files = ["plugins", "test", "conftest.py"]
exclude = [
  'albert-plugin-python-vikunja',
  'cookiecutter',
  'dinatos',
]
# every plugin does `from albert import ...` and the module only exists inside
# the running launcher. `test/albert_stub.py` is the stand-in for the runtime
# path; `stubs/` is the stand-in for the type checker.
mypy_path = "stubs"
ignore_missing_imports = true

# Legacy debt. These plugins predate the stub and the type check, and 53 of
# their errors are real findings in code nobody has touched in years - anki
# returning None from a StandardItem, killproc doing the same, words assigning
# to a method, taskwarrior using a global before it is defined. Fixing them is
# a change to each plugin, not to the tooling, and none of them has a test to
# catch a mistake, so they are exempted here rather than rewritten in a commit
# whose job is linting. Everything else in plugins/ is checked, and these files
# are checked again as soon as they are fixed: drop them from this list and see
# what mypy says. mypy 2.x dropped --baseline-file, which would have been the
# tidier way to say the same thing.
#
# Reminders kept on line per file, because the error codes differ per plugin
# and a blanket ignore_errors would hide new errors in the same file. The
# names carry no `plugins.` prefix because plugins/ has no __init__.py, so
# mypy resolves each plugin as a top-level module - `mypy -v` shows it.
[[tool.mypy.overrides]]
module = [
  "anki.*",           # real bugs: missing returns, no-any-return
  "bluetooth.*",      # var-annotated, misc
  "clock.*",          # arg-type
  "colors.*",         # no-any-return
  "contacts.*",       # var-annotated
  "emoji_picker.*",   # assignment
  "image_search.*",   # valid-type: BingImage is a NamedTuple, not a class
  "jira.*",           # attr-defined: third-party module, no stubs
  "killproc.*",       # return-value: real bugs, see anki
  "meme_generator.*", # var-annotated
  "pass_rlded.*",     # attr-defined, no-any-return
  "remmina.*",        # no-any-return
  "taskwarrior.*",    # used-before-def: real bug, see words
  "timezones.*",      # no-any-return
  "tldr_pages.*",     # assignment
  "words.*",          # method-assign: real bug, assigning to a method
]
ignore_errors = true

# pylint -----------------------------------------------------------------------
[tool.pylint]
[tool.pylint.master]
persistent = "yes"
suggestion-mode = "yes"
unsafe-load-any-extension = "no"
ignore = "VCS"

[tool.pylint.messages_control]
disable = "C0330,C0326,C0103,W0613,R0201,R1720,R1705,W0104,C0301"

[tool.pylint.refactoring]
max-nested-blocks = 5
never-returning-functions = "sys.exit,argparse.parse_error"

[tool.pylint.similarities]
ignore-comments = "yes"
ignore-docstrings = "no"
ignore-imports = "yes"
# ignore-signatures=no
min-similarity-lines = 4

[tool.pylint.format]
max-line-length = 95
ignore-invalid-name = true
max-module-lines = 500

[tool.pylint.string]
check-quote-consistency = "yes"

# pyright ----------------------------------------------------------------------
[tool.pyright]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.8"
pythonPlatform = "Linux"

# coverage.py ------------------------------------------------------------------
[tool.coverage]
[tool.coverage.run]
omit = [
  "quickstart.py",
  "quickstart_gkeep.py",
  "a.py",
  "*/.pdbrc.py",
  "tests/*",
]

# pytest -----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
# Only the plugins are this repository's code. `plugins` and `test` hold it all;
# running a bare `pytest` must not wander into the projects listed in
# norecursedirs, which are somebody's checkout of a different app entirely.
testpaths = ["plugins", "test"]
addopts = [
  # plugin docstrings carry runnable examples, and they are the only place the
  # documented behaviour of a helper is written down, so run them
  "--doctest-modules",
  # `from conftest import load_plugin` in a plugin's own tests, plus two
  # conftest.py files of the same basename in unrelated checkouts, is a recipe
  # for the wrong one winning. importlib mode gives every test module a unique
  # name instead of deriving it from the directory.
  "--import-mode=importlib",
  "-ra",
]
# gitignored checkouts of other projects, and non-python trees
norecursedirs = [
  "albert-plugin-python-vikunja",
  "cookiecutter",
  "dinatos",
  "themes",
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
]
markers = [
  "network: test needs internet access (deselected by default)",
]

# ruff -------------------------------------------------------------------------
[tool.ruff]
line-length = 95
target-version = "py38"
extend-exclude = [
  # Jinja templates, not python: cookiecutter substitutes {{cookiecutter.x}}
  # before this file is ever run, so no linter can read it. pytest and mypy
  # need the same exclusion, which is why it is repeated in both.
  "cookiecutter",
]
# The launcher attaches these to the plugin's own module (py::setattr in
# albert-plugin-python's pypluginloader.cpp), so inside a plugin they are bare
# globals that no import can satisfy - the 27 of them would otherwise be F821.
# Same reason mypy has name-defined off. Not under [tool.ruff.lint]: ruff 0.16
# only reads `builtins` at the top level.
builtins = ["debug", "info", "warning", "critical"]

[tool.ruff.lint]
# The set that a project like this one actually wants: pyflakes and pycodestyle
# for correctness, isort for the import blocks every plugin has, pyupgrade for
# the 3.8 floor declared just above, and a handful of bug-catchers that earn
# their keep. Deliberately not the "ALL" that ruff offers: the style-only rules
# (COM, Q, ANN on third-party call sites, ...) would rewrite working plugins for
# no gain, and this is a collection of upstreamed third-party code, not a
# greenfield codebase.
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "UP",    # pyupgrade - this is what holds the line at python 3.8
  "B",     # flake8-bugbear
  "C4",    # comprehensions
  "RET",   # return statements
  "PIE",   # misc lints
  "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The runtime double and its consistency test deliberately define names that
# shadow builtins (Icon.image, Match.text) and import the plugin modules by
# path rather than by package.
"test/*" = ["A002", "F401"]
# A .pyi is never executed, so it is not held to the 3.8 floor of the code it
# describes: mypy reads it under python_version 3.10 and PEP 585/604 spellings
# are what the rest of the stub already uses. `builtins` in the signatures is
# deliberate too - a stub may name a parameter anything, and several mirror the
# C++ binding's argument names.
"stubs/*.pyi" = ["UP006", "UP007", "UP035", "UP045"]

# --- legacy plugins ----------------------------------------------------------------------
#
# These are upstreamed third-party code, and the findings below are all
# stylistic or mechanical: `open(p, "r")` with an explicit mode (UP015),
# `super(Cls, self)`, an assignment immediately before a return (RET504), a
# line over 95 columns. Fixing them is a real change to each plugin - and
# reformatting working code nobody has asked to touch, in a commit whose job is
# tooling, is exactly the kind of change that gets reverted wholesale. Ruff has
# no --baseline-file to lean on, so the debt is listed instead, per file and
# per code: a NEW violation in any of these files still fails, because only the
# codes already present are ignored. When a file is tidied, delete its line
# here and `ruff check` will tell you what is left.
"plugins/taskwarrior/__init__.py" = [
  "B008", "B026", "F401", "RET503", "RET504", "RET505", "RUF001", "UP008", "UP015", "UP032",
]
"plugins/colors/__init__.py" = ["B008", "C416", "E501", "E722", "RET504", "RET505", "UP015"]
"plugins/anki/__init__.py" = ["B026", "RET502", "RET503", "RUF013", "UP008", "UP015"]
"plugins/jira/__init__.py" = ["B008", "E501", "RET504", "UP015", "UP022", "UP034"]
"plugins/killproc/__init__.py" = ["B008", "C417", "C419", "E501", "RET504", "UP015"]
"plugins/timezones/__init__.py" = ["C416", "C418", "E501", "F401", "RET504", "UP015"]
"plugins/saxophone/test/test_links.py" = ["E402", "E501", "I001", "RET504", "UP015"]
"plugins/bluetooth/__init__.py" = ["E501", "RET504", "RET505", "UP015"]
"plugins/emoji_picker/__init__.py" = ["E501", "RET504", "RUF013", "UP015"]
"plugins/image_search/__init__.py" = ["E711", "F821", "RET504", "UP008", "UP015"]
"plugins/pass_rlded/__init__.py" = ["B008", "E501", "UP015", "UP034"]
"plugins/tldr_pages/__init__.py" = ["E501", "RET504", "RUF015", "UP015"]
"plugins/words/__init__.py" = ["E501", "RET504", "UP008", "UP015"]
"plugins/abbr/__init__.py" = ["C419", "E501", "UP015"]
"plugins/clock/__init__.py" = ["F401", "RET505", "UP008"]
"plugins/ipshow/__init__.py" = ["B006", "E501", "E722"]
"plugins/meme_generator/__init__.py" = ["E501", "F821", "RET504", "UP015"]
"plugins/remmina/__init__.py" = ["C416", "RET505", "UP031"]
"plugins/contacts/__init__.py" = ["E501", "UP022"]
"plugins/errno_lookup/__init__.py" = ["E501", "E741"]
"plugins/image_search/bing.py" = ["E501", "E731"]
"plugins/saxophone/__init__.py" = ["RET506", "UP008"]
"plugins/scratchpad/__init__.py" = ["E501", "UP015"]
"plugins/pass_totp_cli/__init__.py" = ["UP015"]
"plugins/url_lookup/__init__.py" = ["UP015"]
"plugins/pulse_control/__init__.py" = ["E501"]

# F821 in image_search and meme_generator specifically: dead module-level
# duplicates of the PluginInstance methods of the same name, referring to a
# `config_path` that only ever exists as `self.config_path`. They are never
# called, so it is a real latent bug in dead code, and removing them is a change
# to the plugin rather than to the linting.

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.ruff.lint.flake8-bugbear]
# B008: the api keys here are function defaults in a dispatcher table, evaluated
# once at import; that is how the existing backends are already written.
extend-immutable-calls = ["albert.Notification", "albert.Action"]

